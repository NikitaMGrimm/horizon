name: needs info
# Closes an issue 7 days after a reviewer labels it `needs-info` (`/label needs-info`), when nobody has answered.
# Any new comment takes the label off and keeps the issue open. Never marks anything by itself, never touches pull
# requests (docs/release-flow.md "Trusted reviewers").
#
# On GitHub's runners: the token writes issues (docs/ci-runners.md "What stays on GitHub, and why"). No checkout:
# nothing from the repository runs.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          only-issue-labels: needs-info
          stale-issue-label: needs-info
          days-before-issue-stale: -1
          days-before-issue-close: 7
          remove-issue-stale-when-updated: true
          days-before-pr-stale: -1
          days-before-pr-close: -1
          close-issue-reason: not_planned
          close-issue-message: >-
            Closing: no answer in 7 days after we asked for more information. Comment with the missing details and
            it can be reopened.
          operations-per-run: 200
